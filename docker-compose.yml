services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        PHP_VERSION: ${PHP_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION:-2}
    container_name: ${COMPOSE_PROJECT_NAME}_php
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE}
      COMPOSER_HOME: /composer-home
      # Lets a bare `mysql`/`mariadb` inside this container reach the `db` service
      # without extra flags -- there's no local MySQL server here to fall back to a
      # unix socket for. MYSQL_PWD is a client-recognized env var (not a CLI arg),
      # so the password never shows up in `ps`/shell history.
      MYSQL_HOST: db
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./public_html:/var/www/public_html
      - ${HOME}/.composer-magento-docker:/composer-home
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
    networks:
      - magento

  nginx:
    image: nginx:stable-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./public_html:/var/www/public_html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php
    networks:
      - magento

  db:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./public_html:/var/www/public_html
    networks:
      - magento

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME}_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - db
    networks:
      - magento

  # Search engine: exactly one of opensearch / elasticsearch runs at a time, picked
  # by SEARCH_ENGINE + COMPOSE_PROFILES in .env (set by `./magento init`). Compose
  # profiles mean `docker compose up` only ever starts the one that's active.
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.8.0}
    container_name: ${COMPOSE_PROJECT_NAME}_opensearch
    restart: unless-stopped
    profiles: ["opensearch"]
    env_file:
      - ./env/opensearch.env
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${SEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - magento

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.11.0}
    container_name: ${COMPOSE_PROJECT_NAME}_elasticsearch
    restart: unless-stopped
    profiles: ["elasticsearch"]
    env_file:
      - ./env/elasticsearch.env
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${SEARCH_PORT}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - magento

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    networks:
      - magento

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME}_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    networks:
      - magento

networks:
  magento:
    driver: bridge

volumes:
  mariadb-data:
  opensearch-data:
  elasticsearch-data:
